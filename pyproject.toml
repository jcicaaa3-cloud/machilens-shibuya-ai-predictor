[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machilens-shibuya-ai-predictor"
version = "0.1.0"
description = "MachiLens: AI-based urban scenario prediction simulator for Shibuya."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MachiLens Project Contributors" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "torch>=2.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
app = ["streamlit>=1.32"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
